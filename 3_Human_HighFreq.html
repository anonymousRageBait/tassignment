<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetailPro Sales Analyst Study</title>
<style>
:root{color-scheme:light;--b:#1d4e89;--t:#1c2733;--m:#5b6b7b;--l:#d9e0e8}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f6f9;color:var(--t)}
header{background:var(--b);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;font-weight:600}
#bar{height:4px;background:#9db8d6}#bar i{display:block;height:100%;width:0;background:#f5a623;transition:width .3s}
main{max-width:820px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:22px;margin-bottom:16px}
h1{font-size:1.5rem;margin:0 0 .6em}h2{font-size:1.15rem;margin:1em 0 .5em}.card>h2:first-child{margin-top:0}
table{border-collapse:collapse;width:100%;margin:10px 0}th,td{border:1px solid var(--l);padding:6px 10px;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#eaf0f7}
input[type=text],input[type=number],select,textarea{font:inherit;padding:8px;border:1px solid #aab6c3;border-radius:6px;max-width:100%}textarea{width:100%;min-height:70px}
fieldset{border:0;padding:0;margin:0}
button{font:inherit;background:var(--b);color:#fff;border:0;border-radius:6px;padding:10px 22px;cursor:pointer;margin-top:10px}button:disabled{opacity:.4;cursor:not-allowed}
.q{margin:14px 0;padding-bottom:10px;border-bottom:1px solid #eef1f5}
.sc{display:flex;gap:4px;margin-top:6px}.sc label{flex:1;text-align:center;border:1px solid #aab6c3;border-radius:6px;padding:6px 0;cursor:pointer;font-size:.9rem}.sc input{display:block;margin:0 auto 2px}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--m);margin-top:3px}
.fb{display:flex;gap:14px;border:1px solid var(--b);background:#eef4fb;border-radius:10px;padding:14px;margin:14px 0}
.fb svg{flex:none;width:48px;height:48px}.fb small{display:block;color:var(--m);margin-bottom:4px}
.err{color:#b3261e;font-size:.9rem;min-height:1.3em}.muted{color:var(--m);font-size:.9rem}
</style></head><body>
<header><span>RetailPro Sales Analytics</span><span id="clk"></span></header><div id="bar"><i></i></div><main id="app"></main>
<script>
const SUBMIT_URL="https://script.google.com/macros/s/AKfycbyeCUGFs_-Jf5MpGIRIAr9L6DBhU6NLitdGaW1Z5K-7wJfkkr4bc-5hphZcx5FwXVQs/exec";            // paste your Google Apps Script web-app URL here (see SETUP.md)
const COMPLETION_URL="";        // optional: Prolific completion link
const C={"id": 3, "src": "Human", "freq": "High"};
const $=s=>document.querySelector(s),app=$('#app'),P=new URLSearchParams(location.search);
const RG=["North","South","East","West","Central"];
const R=[
{d:{North:[120,124,128,131,135,139],South:[98,101,52,100,104,107],East:[145,150,148,155,160,168],West:[110,108,112,115,113,118],Central:[90,94,97,95,99,102]},a:["South",3]},
{d:{North:[160,165,171,176,182,189],South:[120,118,124,127,125,131],East:[135,139,141,138,144,148],West:[150,153,149,74,152,156],Central:[110,113,111,116,119,123]},a:["West",4]},
{d:{North:[140,143,147,146,151,155],South:[175,181,188,192,199,206],East:[168,85,166,171,169,174],West:[130,134,131,137,140,144],Central:[105,108,112,109,114,118]},a:["East",2]}];
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length,rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const topReg=r=>RG.reduce((b,g)=>sum(R[r].d[g])>sum(R[r].d[b])?g:b);
const fc=(r,g)=>{const x=R[r].d[g];return x[5]*x[5]/x[4]};
const pct=a=>Math.max(5,Math.min(95,Math.round(45+(a-67.5)*.9)));
const ord=n=>n+(n%100>10&&n%100<14?'th':['th','st','nd','rd'][n%10]||'th');
const S={condition:C.id,source:C.src,frequency:C.freq,start:new Date().toISOString()},ACC=[];
const LBL=C.src=='AI'?'Powered by RetailPro AI Analytics':'Direct message from your supervisor';
const IC={AI:'<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#1d4e89"/><rect x="10" y="26" width="6" height="12" fill="#fff"/><rect x="21" y="18" width="6" height="20" fill="#fff"/><rect x="32" y="10" width="6" height="28" fill="#f5a623"/></svg>',
Human:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#c9d6e4"/><circle cx="24" cy="19" r="8" fill="#6b7f95"/><path d="M8 42c2-10 10-13 16-13s14 3 16 13a24 24 0 0 1-32 0z" fill="#6b7f95"/></svg>'}[C.src];
const SC={a:["Strongly Disagree","Strongly Agree"],f:["Very Infrequently","Very Frequently"],p:["Very Poorly","Very Well"],v:["Not at all","Very familiar"]};
const sc=(n,s)=>`<div class="sc">${[1,2,3,4,5,6,7].map(v=>`<label><input type="radio" name="${n}" value="${v}">${v}</label>`).join('')}</div><div class="ends"><span>1 = ${SC[s][0]}</span><span>7 = ${SC[s][1]}</span></div>`;
const sel=(n,o)=>`<select name="${n}"><option value="">Select…</option>${o.map(x=>Array.isArray(x)?`<option value="${x[0]}">${x[1]}</option>`:`<option>${x}</option>`).join('')}</select>`;
const prog=i=>$('#bar i').style.width=i/15*100+'%';
const render=(h,p)=>{app.innerHTML=h;scrollTo(0,0);prog(p)};
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
const cont=fn=>{const b=document.createElement('button');b.textContent='Continue';b.onclick=()=>{b.disabled=true;fn()};app.appendChild(b)};
const tbl=r=>`<table><tr><th>Region ($K)</th>${[1,2,3,4,5,6].map(w=>`<th>Wk ${w}</th>`).join('')}</tr>${RG.map(g=>`<tr><td>${g}</td>${R[r].d[g].map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;
const RULE='<b>Trend rule:</b> % change = (Wk 6 − Wk 5) ÷ Wk 5. Forecast for Wk 7 = Wk 6 × (1 + % change).';

function fb(text,cb){const b=document.createElement('div');b.className='fb';
 b.innerHTML=IC+'<div><small>'+LBL+'</small><i class="muted">'+(C.src=='AI'?'Evaluating your response…':'Your supervisor is reviewing your response…')+'</i></div>';app.appendChild(b);
 setTimeout(()=>{b.lastChild.innerHTML='<small>'+LBL+'</small>'+text;cb()},rnd(1500,2500))}

function welcome(){render(`<div class="card"><h1>Sales Analyst Decision-Making Study</h1><p>You are invited to take part in a research study on how people perform analytical work. It takes about 35 minutes: a 20-minute work session followed by a short questionnaire. Participation is voluntary, your responses are anonymous and used for research only, and you may stop at any time by closing this window.</p><form id="f"><p>Participant / Prolific ID<br><input type="text" name="pid" value="${P.get('PROLIFIC_PID')||''}"></p><label><input type="checkbox" name="ok"> I am 18 or older and I agree to take part.</label><div class="err"></div><button>Continue</button></form></div>`,0);
 $('#f').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  if(!f.pid.trim()||!f.ok)return $('.err').textContent='Enter your ID and tick the consent box to continue.';S.pid=f.pid.trim();cover()}}

function cover(){render(`<div class="card"><h2>Your role</h2><p><i>Imagine you have just joined as a Sales Analyst at <b>RetailPro</b>, a mid-sized consumer goods company. Your manager has asked you to analyze weekly sales data and produce a regional sales forecast over a 20-minute work session. Your performance will be evaluated based on the accuracy and quality of your analysis. You will receive performance feedback during the task.</i></p>
<h2>The task</h2><p>There are <b>three rounds</b> (about 6–7 minutes each). Each round shows six weeks of sales ($K) for five regions. In every round you complete three tasks in order:</p>
<ol><li>Identify the <b>top-performing region</b> (highest total sales over the six weeks) and justify it in one sentence.</li><li><b>Forecast Week 7 sales</b> for each region.</li><li><b>Flag the anomaly</b> in the data (a sudden drop) and briefly explain what may have caused it.</li></ol>
<p>${RULE} Example: a region sold 80 in Wk 5 and 88 in Wk 6, so % change = (88−80)÷80 = 10% and the Wk 7 forecast = 88 × 1.10 = 96.8. Forecasts within ±5% of the correct value count as correct.</p><p class="muted">Answers cannot be changed after you submit them. A calculator is fine.</p><button id="go">Start Round 1</button></div>`,1);
 $('#go').onclick=()=>{S.t0=Date.now();setInterval(()=>{const s=Math.floor((Date.now()-S.t0)/1000);$('#clk').textContent='Session time '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);sub(0,0)}}

function intro(r){render(`<div class="card"><h2>Round ${r+1} of 3</h2><p>A new weekly sales dataset is ready.</p><button id="go">Start Round ${r+1}</button></div>`,2+r*3);$('#go').onclick=()=>sub(r,0)}

function sub(r,k){const T=["Top-performing region","Sales forecast","Anomaly detection"],t0=Date.now(),p=`r${r+1}_s${k+1}_`;
 const body=k==0?`<p>Which region is the <b>top-performing region</b> (highest total sales, Wk 1–6)?</p>${sel('top',RG)}<p>Justify your choice in one sentence:</p><textarea name="just"></textarea>`
 :k==1?`<p>Forecast <b>Wk 7</b> sales ($K) for each region.</p><p class="muted">${RULE}</p>${RG.map(g=>`<p>${g}: <input type="number" step="any" name="f_${g}" style="width:140px"></p>`).join('')}`
 :`<p>One region shows an <b>anomaly</b> (a sudden drop). Which region and week? </p>${sel('reg',RG)} ${sel('wk',[1,2,3,4,5,6].map(w=>[w,'Week '+w]))}<p>What may have caused it?</p><textarea name="expl"></textarea>`;
 render(`<div class="card"><h2>Round ${r+1} of 3 · Task ${k+1} of 3: ${T[k]}</h2>${tbl(r)}<form id="f"><fieldset>${body}</fieldset><div class="err"></div><button>Submit answer</button></form></div>`,2+r*3+k);
 $('#f').onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
  const bad=k==0?!fd.top||words(fd.just)<3:k==1?RG.some(g=>fd['f_'+g]===''):!fd.reg||!fd.wk||words(fd.expl)<5;
  if(bad)return $('.err').textContent='Please complete every field (written answers need a few words).';
  e.target.querySelector('fieldset').disabled=true;e.target.querySelector('button').disabled=true;
  const a=k==0?(fd.top==topReg(r)?100:0):k==1?100*RG.filter(g=>Math.abs(fd['f_'+g]-fc(r,g))<=.05*fc(r,g)).length/5:(fd.reg==R[r].a[0]?50:0)+(+fd.wk==R[r].a[1]?50:0);
  Object.entries(fd).forEach(([x,v])=>S[p+x]=v);S[p+'acc']=a;S[p+'sec']=Math.round((Date.now()-t0)/1000);(ACC[r]=ACC[r]||[]).push(a);
  const go=()=>k<2?sub(r,k+1):endRound(r);
  if(C.freq=='High'){const acc=r<2?rnd(65,70):a,pc=r<2?rnd(40,48):pct(mean(ACC[r])),rk=1+Math.round((1-pc/100)*11);S[p+'shown_acc']=acc;S[p+'shown_pct']=pc;
   fb(C.src=='AI'?`<b>AI Performance System:</b> Your response has been evaluated. Accuracy: ${acc}%. Your current overall session performance ranks you at the ${ord(pc)} percentile among all analysts.`
   :`<b>Feedback from Your Supervisor (Sarah Chen, Regional Manager):</b> I've reviewed your response. Accuracy: ${acc}%. You are currently ranked ${ord(rk)} among analysts I'm tracking this session.`,()=>cont(go))}
  else go()}}

function endRound(r){const ra=mean(ACC[r]);S['r'+(r+1)+'_acc']=ra;const done=()=>r<2?intro(r+1):qpage(0);
 if(C.freq=='High')return done();
 const sh=r<2?rnd(65,70):Math.round(ra);S[`r${r+1}_end_shown_acc`]=sh;
 render(`<div class="card"><h2>Round ${r+1} of 3 complete</h2></div>`,4+r*3);
 fb(C.src=='AI'?`<b>AI Performance System:</b> Round ${r+1} complete. Your cumulative accuracy is ${sh}%.`:`<b>Feedback from Your Supervisor (Sarah Chen, Regional Manager):</b> End of Round ${r+1}. Your cumulative accuracy is ${sh}%.`,()=>cont(done))}

const A=(p,l)=>l.map((t,i)=>[p+(i+1),t]);
const PG=[
[{h:"Feedback source check",s:"a",q:A("MC_SRC",["The performance feedback I received came from an automated AI system.","The performance feedback I received came from a human supervisor.","I felt I was being evaluated by a person throughout the task."])},
 {h:"Feedback frequency check",s:"f",q:A("MC_FRQ",["How frequently did you receive performance feedback during the task?","I received feedback after almost every action I took during the task."])}],
[{h:"Section 1: Mindset during the task",i:"Reflect on your mindset and goals while completing the sales analysis task. Please rate how much each statement describes how you felt during the task.",s:"a",q:A("PAO",["I was focused on avoiding performing worse than other analysts.","My main concern was not looking incompetent in this task.","I worried about what would happen if I did poorly in this evaluation.","I was motivated primarily by the fear of performing below expectations.","Avoiding a low performance ranking was my primary concern during the task."])},
 {h:"Section 2: The feedback source",i:"Rate your agreement with the following statements about the feedback source you worked with.",s:"a",q:A("TFS",["I trusted the accuracy of the performance feedback I received.","The feedback source seemed reliable and consistent.","I felt comfortable relying on the feedback to guide my work.","I believed the feedback source was competent in evaluating my performance."])}],
[{h:"Section 3: Feedback and pressure",s:"a",q:A("FP",["The frequency of performance feedback during the task felt overwhelming.","I felt under pressure because of how often I was being evaluated.","Receiving frequent feedback made me more anxious about my performance."])},
 {h:"Section 4: Attention check",s:"a",q:[["ATT","This is an attention check. Please select 'Somewhat Agree' (option 5) for this item regardless of your opinion."]]},
 {h:"Section 5: Your own performance",s:"p",q:A("SP",["Overall, how well do you think you performed on the sales analysis task?","How accurate do you believe your sales forecasts were?","How confident are you in the quality of your analysis?"])}],
[{h:"Section 6: Views on AI evaluation",s:"a",q:A("AA",["I generally trust AI systems more than humans to give accurate performance feedback.","I would prefer a human manager to evaluate my work rather than an AI system.","I feel uncomfortable being evaluated by an automated system.","AI-generated performance assessments are less meaningful to me than feedback from a person."])}]];
const DEMO=()=>`<h2>Section 7: About you</h2><div class="q">Age (years)<br><input type="number" name="age" min="18" max="99" style="width:120px"></div><div class="q">Gender<br>${sel('gender',['Male','Female'])}</div><div class="q">Prior experience with AI performance tools at work<br>${sel('ai_exp',['Yes','No'])}</div><div class="q">Educational background<br>${sel('edu',['Undergraduate','Graduate','Postgraduate'])}</div><div class="q">Familiarity with sales/financial data analysis${sc('fam','v')}</div>`;

function qpage(i){render(`<div class="card"><form id="f">${PG[i].map(b=>`<h2>${b.h}</h2>${b.i?`<p class="muted">${b.i}</p>`:''}${b.q.map(([n,t])=>`<div class="q">${t}${sc(n,b.s)}</div>`).join('')}`).join('')}${i==3?DEMO():''}<div class="err"></div><button>${i<3?'Next':'Finish'}</button></form></div>`,11+i);
 $('#f').onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
  const miss=[...new Set([...e.target.querySelectorAll('[name]')].map(x=>x.name))].filter(n=>!fd[n]);
  if(miss.length||(i==3&&(fd.age<18||fd.age>99)))return $('.err').textContent='Please answer every question'+(i==3?' (age must be 18–99)':'')+'.';
  Object.assign(S,fd);i<3?qpage(i+1):finish()}}

async function finish(){S.end=new Date().toISOString();S.duration_s=Math.round((Date.now()-S.t0)/1000);S.attn_pass=S.ATT=='5'?1:0;S.dv_r3_accuracy=Math.round(S.r3_acc*10)/10;S.ua=navigator.userAgent;S.done=1;
 const body=JSON.stringify(S);try{localStorage.setItem('rp_'+S.pid,body)}catch(e){}
 if(SUBMIT_URL)try{await fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body})}catch(e){}
 render(`<div class="card"><h1>Thank you — debriefing</h1><p>This was a study of how performance feedback affects motivation and performance. <b>The feedback you saw during Rounds 1 and 2 (accuracy scores and rankings) was pre-set and did not reflect your actual answers</b>, and "${C.src=='AI'?'RetailPro AI Analytics':'Sarah Chen'}" was part of the study scenario — no real ${C.src=='AI'?'AI system':'supervisor'} evaluated you. Round 3 feedback reflected your real accuracy. Your performance has no consequences for you. We used this design to compare conditions fairly; please do not discuss the study with others who may take part.</p>${COMPLETION_URL?`<p><a href="${COMPLETION_URL}">Return to Prolific to confirm completion</a></p>`:''}${SUBMIT_URL?'':'<p class="muted">Test mode (no SUBMIT_URL set): <a id="dl" href="#">download responses (JSON)</a></p>'}</div>`,15);
 const d=$('#dl');if(d)d.onclick=()=>{d.href=URL.createObjectURL(new Blob([body],{type:'application/json'}));d.download='response_'+S.pid+'.json'}}
onbeforeunload=e=>{if(S.t0&&!S.done){e.preventDefault();return e.returnValue=''}};
welcome();
</script></body></html>
